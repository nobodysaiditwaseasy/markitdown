name: Convert Files to Markdown

on:
  push:
    paths:
      - 'input_files/**'
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install MarkItDown
        run: |
          pip install markitdown

      - name: Process Files
        run: |
          python -c "
          import os
          from markitdown import MarkItDown

          md = MarkItDown()
          input_dir = 'input_files'
          output_dir = 'output_md'

          os.makedirs(output_dir, exist_ok=True)

          if os.path.exists(input_dir):
              for filename in os.listdir(input_dir):
                  file_path = os.path.join(input_dir, filename)
                  if os.path.isfile(file_path):
                      base_name = os.path.splitext(filename)[0]
                      out_file = os.path.join(output_dir, f'{base_name}.md')
                      try:
                          res = md.convert(file_path)
                          with open(out_file, 'w', encoding='utf-8') as f:
                              f.write(res.text_content)
                          print(f'Successfully converted: {filename}')
                      except Exception as e:
                          print(f'Error converting {filename}: {e}')
          "

      - name: Commit and Push converted Markdown files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output_md/
          git status
          git commit -m "Auto-convert uploaded files to markdown" || exit 0
          
          # Push otomatis menggunakan Token GH_PAT ke branch yang sedang digunakan
          CURRENT_BRANCH=${GITHUB_REF#refs/heads/}
          git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git HEAD:$CURRENT_BRANCH
